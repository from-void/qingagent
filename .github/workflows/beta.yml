name: beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  build:
    name: beta-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            electron_builder_args: --linux
          - name: mac
            os: macos-latest
            electron_builder_args: --mac zip
    env:
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 官方构建可注入下载站地址；fork 默认留空。
      VITE_DESKTOP_SITE_URL: ''
      # 不设置 QINGAGENT_UPDATE_POLICY_URL：policy 未托管时客户端 fail-open。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack prepare 从 registry 拉 pnpm,GitHub Windows runner 偶发瞬时网络错;重试 3 次。
          for i in 1 2 3; do
            corepack prepare pnpm@9.15.0 --activate && break
            echo "corepack prepare failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "${{ github.ref_name }}"

      - name: build desktop
        run: pnpm build:desktop

      - name: publish macOS artifacts (signed + notarized)
        if: matrix.name == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 用 tag(去掉前导 v)作 app 版本,保持 beta 产物与发布 tag 一致。
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter @qingagent/desktop exec electron-builder ${{ matrix.electron_builder_args }} -c.mac.notarize=true --publish always -c.publish.provider=github -c.publish.owner=from-void -c.publish.repo=qingagent -c.publish.releaseType=prerelease -c.extraMetadata.version="$VERSION"

      - name: publish Linux artifacts
        if: matrix.name == 'linux'
        run: |
          # 用 tag(去掉前导 v)作 app 版本,保持 beta 产物与发布 tag 一致。
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter @qingagent/desktop exec electron-builder ${{ matrix.electron_builder_args }} --publish always -c.publish.provider=github -c.publish.owner=from-void -c.publish.repo=qingagent -c.publish.releaseType=prerelease -c.extraMetadata.version="$VERSION"

  # Windows 安装器在 ubuntu runner 上用 wine 交叉构建(不再用 windows-latest)。
  # 实测定论:免费 2 核 windows runner 压不完整包 solid-LZMA(30-75min 超时),但同一 payload
  # 在多核 Linux 上 <2min 压完。electron-builder 从 Linux 打 NSIS 需 wine 跑 32 位卸载器 stub,
  # 用 Kron4ek wow64 静态 wine(纯 64 位/免 root/免 32 位宿主库)解决。全流程封装在
  # apps/desktop/build-win-installer.sh。needs: build 确保 linux/mac 已建好 release 再往里 upload。
  build-windows:
    name: beta-windows
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        shell: bash
    env:
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_DESKTOP_SITE_URL: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "${{ github.ref_name }}"

      - name: build windows installer (wine cross-build)
        run: bash apps/desktop/build-win-installer.sh "${GITHUB_REF_NAME#v}"

      - name: upload installer + update feed to release
        run: |
          gh release upload "${{ github.ref_name }}" --repo from-void/qingagent \
            apps/desktop/release/qingagent-*-win-x64.exe \
            apps/desktop/release/latest.yml --clobber

