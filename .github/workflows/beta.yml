name: beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  build:
    name: beta-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # windows nsis 已实测定论:7za -mx=9 压 ~300MB app 成安装器,免费 2 核 runner 上
    # 75min(近 CI 上限)都压不完——非配置可救,是算力不足。保留 35min 尝试(供日后瘦 payload
    # 或换 4-8 核付费 runner 后自然通过)+ continue-on-error 兜底,不阻断 linux+mac 发布。
    # 当前 windows 分发走 build-win.sh 的便携包(win-unpacked,不经 nsis 压缩,即时可用)。
    timeout-minutes: 35
    continue-on-error: ${{ matrix.name == 'windows' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            electron_builder_args: --linux
          - name: mac
            os: macos-latest
            electron_builder_args: --mac zip
          - name: windows
            os: windows-latest
            electron_builder_args: --win nsis
    env:
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 官方构建可注入下载站地址；fork 默认留空。
      VITE_DESKTOP_SITE_URL: ''
      # 不设置 QINGAGENT_UPDATE_POLICY_URL：policy 未托管时客户端 fail-open。
    steps:
      - uses: actions/checkout@v4

      # win nsis 卡死已穷尽排查并定论(见下,均实测证伪/无效,不再重试):
      #   · 本地对照:同一个 electron-builder 7za,在 Linux 跑 win-unpacked(410MB/7822 文件)<2min
      #     就完;Windows runner 上 30min+ 未完被掐 → Windows-runner 特有。
      #   · Defender 假设已证伪:关实时监控 + 排除 7za/7z/makensis 进程,轮询 25min 仍卡在 publish。
      #   · differentialPackage:false 已跳过差分 app.7z,仍卡 → 卡的是 makensis 对整包 ~300MB payload
      #     的 solid-LZMA 压缩(electron-builder 自生成 nsis 脚本,installer.nsh 的 SetCompressor 覆盖
      #     不生效);compression:store / 自定义 SetCompressor / CJK 文件名 均实测无效。
      #   结论:免费 2 核 runner 压不完这个整包 solid 压缩,非配置可救。windows 分发走 build-win.sh
      #   的便携包(win-unpacked,即时可用);continue-on-error 保证不阻断 linux+mac 发布。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack prepare 从 registry 拉 pnpm,GitHub Windows runner 偶发瞬时网络错;重试 3 次。
          for i in 1 2 3; do
            corepack prepare pnpm@9.15.0 --activate && break
            echo "corepack prepare failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "${{ github.ref_name }}"

      - name: build desktop
        run: pnpm build:desktop

      - name: publish beta artifacts
        run: |
          # 用 tag(去掉前导 v)作 app 版本:package.json 恒为 0.1.0,但 beta 构建的
          # 产物/发布 tag 应是 0.1.0-beta.1,否则 electron-builder 按 package version 发到
          # v0.1.0、app 版本也错(影响 allowPrerelease/更新通道)。extraMetadata 只改构建产物。
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter @qingagent/desktop exec electron-builder \
            ${{ matrix.electron_builder_args }} \
            --publish always \
            -c.publish.provider=github \
            -c.publish.owner=from-void \
            -c.publish.repo=qingagent \
            -c.publish.releaseType=prerelease \
            -c.extraMetadata.version="$VERSION"

