name: beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  build:
    name: beta-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 抬到 75min:windows nsis 卡因=7za -mx=9 压 ~300MB app.7z,2 核 runner 上是「慢」(LZMA 压
    # 300MB 可达 30-60min)未必是「卡」,30min 不够跑完。给足时间看能否产出 installer;linux/mac
    # <5min 不受影响。仍配 continue-on-error 兜底:即便 75min 也没压完,windows 不阻断 linux+mac 发布。
    timeout-minutes: 75
    continue-on-error: ${{ matrix.name == 'windows' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            electron_builder_args: --linux
          - name: mac
            os: macos-latest
            electron_builder_args: --mac zip
          - name: windows
            os: windows-latest
            electron_builder_args: --win nsis
    env:
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 官方构建可注入下载站地址；fork 默认留空。
      VITE_DESKTOP_SITE_URL: ''
      # 不设置 QINGAGENT_UPDATE_POLICY_URL：policy 未托管时客户端 fail-open。
    steps:
      - uses: actions/checkout@v4

      # Windows Defender 实时扫描会在 makensis 读取 ~300MB payload(electron+app.asar)时逐文件
      # 拦截,让 nsis 打包卡死/极慢(实测卡在 building target=nsis 后 30min+ 超时)。排除工作目录
      # 与 makensis 进程,规避 AV 拖累。仅 windows 生效,失败静默不阻断。
      - name: Windows Defender exclusion (avoid AV stalling makensis)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "makensis.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions added for workspace + makensis"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack prepare 从 registry 拉 pnpm,GitHub Windows runner 偶发瞬时网络错;重试 3 次。
          for i in 1 2 3; do
            corepack prepare pnpm@9.15.0 --activate && break
            echo "corepack prepare failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "${{ github.ref_name }}"

      - name: build desktop
        run: pnpm build:desktop

      - name: publish beta artifacts
        run: |
          # 用 tag(去掉前导 v)作 app 版本:package.json 恒为 0.1.0,但 beta 构建的
          # 产物/发布 tag 应是 0.1.0-beta.1,否则 electron-builder 按 package version 发到
          # v0.1.0、app 版本也错(影响 allowPrerelease/更新通道)。extraMetadata 只改构建产物。
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter @qingagent/desktop exec electron-builder \
            ${{ matrix.electron_builder_args }} \
            --publish always \
            -c.publish.provider=github \
            -c.publish.owner=from-void \
            -c.publish.repo=qingagent \
            -c.publish.releaseType=prerelease \
            -c.extraMetadata.version="$VERSION"

