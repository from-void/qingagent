name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action v2 用环境变量指定配置；根目录 .gitleaks.toml 也会被自动发现。
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack prepare 从 registry 拉 pnpm,偶发瞬时网络错;重试 3 次。
          for i in 1 2 3; do
            corepack prepare pnpm@9.15.0 --activate && break
            echo "corepack prepare failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm -r typecheck

      - name: dependency architecture guard
        run: pnpm depcruise

      - name: pnpm build
        run: pnpm -r --if-present build

      # PDF 导出已改为 headless Chromium 渲染 HTML(packages/core toHtml + htmlToPdf)。
      # 需要:① 中文字体(导出排版用 Noto Sans/Serif CJK,family 名为 "Noto Sans CJK SC"/"Noto Serif CJK SC");
      #       ② Playwright 的 Chromium 二进制 + 系统依赖。没装 Chromium 时 PDF 烟测会自动 skip
      #       (browserTestGate.ts 探测),装上即真正跑、覆盖真实 PDF 字节。
      - name: install Noto CJK font (PDF export render)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: install Playwright Chromium (PDF export render)
        run: |
          pnpm --filter @qingagent/core exec playwright install --with-deps chromium
          # 关键:显式把浏览器池指向 Playwright 装好的 Chromium。否则 systemBrowser 探测顺序会
          # 优先命中 runner 上预装的 /usr/bin/microsoft-edge——edge 冷启动+渲染 math→PNG 慢且
          # 非确定,导出烟测在 CI 上时而 >30s 超时(flaky)。用 gate 同款 chromium 即快又稳。
          CHROMIUM_PATH="$(pnpm --filter @qingagent/core exec node -e 'console.log(require("playwright").chromium.executablePath())')"
          echo "QINGAGENT_BROWSER_EXECUTABLE_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          echo "browser pool -> $CHROMIUM_PATH"

      # core 与 server 必须串行:并行时多个 test file 同时拉起浏览器池(导出 PDF/PNG 烟测)
      # 会互相争抢致浏览器崩溃("browser has been closed"),且有 pyodide worker/mock 污染的假红。
      # 见项目约定:这两个包一律 --fileParallelism=false。其余包正常并行。
      - name: pnpm test (core, serial)
        run: pnpm --filter @qingagent/core test -- --fileParallelism=false

      - name: pnpm test (server, serial)
        run: pnpm --filter @qingagent/server test -- --fileParallelism=false

      - name: pnpm test (rest)
        run: pnpm -r --if-present --filter '!@qingagent/core' --filter '!@qingagent/server' test

      - name: deterministic scorers
        run: pnpm scorers
