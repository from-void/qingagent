name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新构建并上传的正式标签，例如 v0.1.5'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'beta') }}
    name: release-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            electron_builder_args: --linux
          - name: mac
            os: macos-latest
            electron_builder_args: --mac zip dmg --arm64 --x64
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 官方构建可注入下载站地址；fork 默认留空。
      VITE_DESKTOP_SITE_URL: ''
      # 不设置 QINGAGENT_UPDATE_POLICY_URL：policy 未托管时客户端 fail-open。
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack prepare 从 registry 拉 pnpm,GitHub Windows runner 偶发瞬时网络错;重试 3 次。
          for i in 1 2 3; do
            corepack prepare pnpm@9.15.0 --activate && break
            echo "corepack prepare failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "$RELEASE_TAG"

      # gh release upload 只会传到「已存在」的 release;改用 --publish never + 手动
      # 上传后没有任何人创建 release 对象("release not found"),这里幂等确保存在。
      - name: ensure release exists
        run: |
          if ! gh release view "$RELEASE_TAG" --repo from-void/qingagent >/dev/null 2>&1; then
            # mac/linux 两个矩阵行并发到这里会竞态建 release:输掉的一方 create 报
            # already exists,再 view 确认存在即视为成功。
            gh release create "$RELEASE_TAG" --repo from-void/qingagent \
              --title "青简 $RELEASE_TAG" --generate-notes || \
              gh release view "$RELEASE_TAG" --repo from-void/qingagent >/dev/null
          fi

      # electron-builder 只打包不编译:dist/main 必须先由 build:desktop 产出,
      # 否则 afterPack 资源校验直接报「桌面主进程 bundle 缺失」。此步曾在改上传
      # 方式时被误删,导致 v0.1.4 首次构建失败——不要再删。
      - name: build desktop
        run: pnpm build:desktop

      - name: publish macOS artifacts (signed + notarized)
        if: matrix.name == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm --filter @qingagent/desktop exec electron-builder ${{ matrix.electron_builder_args }} -c.mac.notarize=true --publish never -c.publish.provider=github -c.publish.owner=from-void -c.publish.repo=qingagent -c.publish.releaseType=release -c.extraMetadata.version="$VERSION"
          shopt -s nullglob
          files=(
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.blockmap
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/latest-mac.yml
          )
          if (( ${#files[@]} == 0 )); then
            echo "No macOS release artifacts were generated."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" --repo from-void/qingagent "${files[@]}" --clobber

      - name: publish Linux artifacts
        if: matrix.name == 'linux'
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm --filter @qingagent/desktop exec electron-builder ${{ matrix.electron_builder_args }} --publish never -c.publish.provider=github -c.publish.owner=from-void -c.publish.repo=qingagent -c.publish.releaseType=release -c.extraMetadata.version="$VERSION"
          shopt -s nullglob
          files=(
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          )
          if (( ${#files[@]} == 0 )); then
            echo "No Linux release artifacts were generated."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" --repo from-void/qingagent "${files[@]}" --clobber

  # Windows 安装器在 ubuntu runner 上用 wine 交叉构建(理由同 build-win-installer.sh:2 核 windows
  # runner 压不完整包 solid-LZMA,Linux 多核 <2min)。needs: build 确保 linux/mac 已建好 release。
  build-windows:
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'beta') }}
    name: release-windows
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_DESKTOP_SITE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "$RELEASE_TAG"

      - name: build windows installer (wine cross-build)
        run: bash apps/desktop/build-win-installer.sh "${RELEASE_TAG#v}"

      - name: upload installer + update feed to release
        run: |
          gh release upload "$RELEASE_TAG" --repo from-void/qingagent \
            apps/desktop/release/qingagent-*-win-x64.exe \
            apps/desktop/release/latest.yml --clobber
