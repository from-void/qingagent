name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.ref_name, 'beta') }}
    name: release-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            electron_builder_args: --linux
          - name: mac
            os: macos-latest
            electron_builder_args: --mac zip --arm64 --x64
    env:
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 官方构建可注入下载站地址；fork 默认留空。
      VITE_DESKTOP_SITE_URL: ''
      # 不设置 QINGAGENT_UPDATE_POLICY_URL：policy 未托管时客户端 fail-open。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack prepare 从 registry 拉 pnpm,GitHub Windows runner 偶发瞬时网络错;重试 3 次。
          for i in 1 2 3; do
            corepack prepare pnpm@9.15.0 --activate && break
            echo "corepack prepare failed (attempt $i/3), retrying in 5s..."
            sleep 5
          done
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "${{ github.ref_name }}"

      - name: build desktop
        run: pnpm build:desktop

      - name: publish release artifacts
        run: |
          # 正式 tag 应与 package.json version 一致(verify-tag 已校验),仍显式用 tag 作
          # app 版本,保持与 beta 通道一致的产物版本口径。
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter @qingagent/desktop exec electron-builder \
            ${{ matrix.electron_builder_args }} \
            --publish always \
            -c.publish.provider=github \
            -c.publish.owner=from-void \
            -c.publish.repo=qingagent \
            -c.publish.releaseType=release \
            -c.extraMetadata.version="$VERSION"

  # Windows 安装器在 ubuntu runner 上用 wine 交叉构建(理由同 build-win-installer.sh:2 核 windows
  # runner 压不完整包 solid-LZMA,Linux 多核 <2min)。needs: build 确保 linux/mac 已建好 release。
  build-windows:
    if: ${{ !contains(github.ref_name, 'beta') }}
    name: release-windows
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        shell: bash
    env:
      QINGAGENT_TELEMETRY_ENDPOINT: ${{ secrets.QINGAGENT_TELEMETRY_ENDPOINT }}
      QINGAGENT_BUNDLE_PYODIDE: '1'
      QINGAGENT_BUNDLE_LARK_CLI: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VITE_DESKTOP_SITE_URL: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: verify release tag
        run: ./scripts/release.sh verify-tag "${{ github.ref_name }}"

      - name: build windows installer (wine cross-build)
        run: bash apps/desktop/build-win-installer.sh "${GITHUB_REF_NAME#v}"

      - name: upload installer + update feed to release
        run: |
          gh release upload "${{ github.ref_name }}" --repo from-void/qingagent \
            apps/desktop/release/qingagent-*-win-x64.exe \
            apps/desktop/release/latest.yml --clobber

