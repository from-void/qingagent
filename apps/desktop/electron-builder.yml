appId: com.qingagent.desktop
productName: 青简
# Windows/Linux 可执行文件名固定 ASCII(避免产物 exe 命名为「青简.exe」的编码/URL 隐患);
# macOS 在 mac.executableName 单独恢复「青简」bundle 名。注:Windows NSIS 打包性能由下方关闭
# 差分包与 Linux/Wine 构建策略保障；旧 resources/installer.nsh 压缩器覆盖已删除，非 CJK 文件名问题。
executableName: qingagent
# 产物文件名用干净 ASCII:默认会取包名 @qingagent/desktop(含 @ 与 /)或中文 productName,
# 上传 GitHub Release 时 "Request path contains unescaped characters"。固定为 qingagent-版本-os-arch。
artifactName: qingagent-${version}-${os}-${arch}.${ext}
# 外部书签/评测复归通过 qingagent://app/#/... 唤起；安装产物需把 scheme 交给当前实例，
# 主进程再在 embedded server 与内部 protocol handler 就绪后排队导航。
protocols:
  - name: 青简会话链接
    schemes:
      - qingagent
  - name: 青简文稿链接
    schemes:
      - qingjian
directories:
  buildResources: resources
  output: release
afterPack: ./afterPackResources.mjs
# asar 打开:把 app 代码/依赖打进单个归档,大幅降文件数——否则 Windows runner 打包
# (zip/nsis)要处理上万散文件被 FS/Defender 拖到卡死(实测 45min 超时)。运行时资源
# (web/pyodide/lark-cli/skills)走 extraResources 在 asar 外不受影响;原生 .node 由
# asarUnpack 解包到 app.asar.unpacked,electron 透明加载。
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@libsql/**"
files:
  - dist/**/*
  # 仅供 CI 在打包后执行，不进入安装包。
  - "!dist/main/packaged-worker-smoke.js"
  - package.json
  - "!src"
  # 排除独立 agent-browser CLI 的平台二进制(产品运行时不用它;它的 .exe 会触发
  # electron-builder 在 Linux 上用 wine 签名 → 无 wine 即失败)。浏览器自动化走 playwright。
  - "!**/node_modules/agent-browser/**"
  - "!**/*.map"
extraResources:
  - from: ../web/dist
    to: web
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../packages/core/skills
    to: skills
  # 首启真实会话 fixture：JSON 行数据与上传资源都在运行时读取，须放在 asar 外。
  - from: ../../packages/core/src/seed/fixtures
    to: seed-fixtures
  # 窗口/任务栏运行时图标(win/linux BrowserWindow icon 用;exe 内嵌图标因
  # signAndEditExecutable:false 不做,任务栏观感由这里兜底)。
  - from: resources/icon-256.png
    to: icon.png
  # Pyodide 运行时:由 build.mjs 按 QINGAGENT_BUNDLE_PYODIDE 暂存到 build/pyodide。
  # flag 关时只含占位文件(安装包体积不变);flag 开时含 ~12MB wasm/stdlib。
  - from: build/pyodide
    to: pyodide
  # qa CLI:build.mjs 无条件打成单文件暂存到 build/qa-cli,首启写用户终端 shim
  # (~/.qingagent/bin/qa),外部 Agent(Claude Code/Codex)装完应用即可用 qa 命令。
  - from: build/qa-cli
    to: qa-cli
  # 飞书 lark-cli:由 build.mjs 按 QINGAGENT_BUNDLE_LARK_CLI 暂存到 build/lark-cli。
  # flag 关时只含占位文件;flag 开时含 @larksuite/cli + 依赖(~26MB)。
  # 运行时 ensureLarkCliShim 据 Resources/lark-cli/node_modules/@larksuite/cli/scripts/run.js 写 PATH shim。
  - from: build/lark-cli
    to: lark-cli
    # electron-builder 默认会过滤 node_modules；显式包含全部暂存文件，避免打出静默瘦包。
    filter:
      - "**/*"
  # 父 fileset 的 filter 仍会叠加 node_modules 默认忽略规则，必须单独复制该目录。
  - from: build/lark-cli/node_modules
    to: lark-cli/node_modules
    filter:
      - "**/*"
mac:
  # electron-builder 会用该平台值生成 productFilename、青简.app 与 CFBundleExecutable;
  # Finder/Dock/菜单栏名及 CFBundleName/CFBundleDisplayName 则由顶层 productName「青简」提供。
  executableName: 青简
  # CI 使用 Developer ID Application 签名；GitHub Actions 的 macOS 发布步骤再开启 Apple notarization。
  # 本地 build-mac.sh 仍保持未签名，便于快速测试；正式/Beta tag 由 GitHub Actions 处理。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.inherit.plist
  target:
    - zip
    - dmg
dmg:
  # 同目录 dmg-background@2x.png 会由 electron-builder 自动配对并合成为 Retina TIFF。
  background: dmg-background.png
  title: ${productName}
  window:
    width: 660
    height: 400
  iconSize: 96
  contents:
    - x: 185
      y: 235
      type: file
    - x: 475
      y: 235
      type: link
      path: /Applications
win:
  # Linux 无 wine:关闭对 exe 的 rcedit/签名(图标/版本元数据),避免 wine 依赖。
  signAndEditExecutable: false
  target:
    - nsis
    - zip
nsis:
  # 260817 产品拍板：改为向导式安装，让用户可指定安装目录；perMachine 保持关闭，
  # 默认仍按每用户安装到 %LOCALAPPDATA%\Programs，无需管理员权限。
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # 关差分包:DEBUG 定位到 win nsis 卡死在 electron-builder 用 7za `-mx=9`(最高压)把
  # ~300MB app(electron+asar+node_modules)打成差分更新用的 app.7z,2 核 runner 30min+
  # 压不完(compression:store/自定义 SetCompressor 都不碰这一步,故此前无效)。差分包只为
  # 增量更新省流量,关掉后走整包更新(功能不缺),跳过这个 -mx=9 大压缩步。
  differentialPackage: false
linux:
  # deb 目标强制要求 maintainer 与 homepage(homepage 取自 package.json);category 不设会告警。
  maintainer: qingagent <security@qingagent.com>
  category: Utility
  target:
    - AppImage
    - deb
