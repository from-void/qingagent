<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青简</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- 启动底色:首页已固定浅色(cc6bf1f),React 挂载前(首帧)即把整页底色铺成浅色纸底,
         消除懒加载大 chunk(HomePage/WorkspacePage)下载期 Suspense 兜底露深底的"中间黑块"闪
         (本地 chunk 秒下看不出、VPS 慢网络尤其明显);路由切换的 Suspense 兜底也复用 --app-boot-bg。
         注:旧版深色首页时这里按主题铺深底(#0e1114/#2a2620),首页固定浅色后那套已不适用。 -->
    <style>
      html, body { margin: 0; }
      html { background: var(--app-boot-bg, #ece4d3); }
      /* 启动骨架:logo 里的泰卦纸页 + 剪影显「青」。慢网络下载大 chunk 期间的加载指示;
         opacity 0 起步、0.35s 后才淡入——本地秒开根本看不到,不添闪烁。
         React 挂载(createRoot().render)整树替换 #root 子节点,骨架自动消失,无需清理代码。
         周期 3.6s:0-48% 完整「青」以玄青墨剪影自上而下擦出(clip-path inset)
         → 定格到 82% → 淡出 → 重来。无扫光带、不逐笔;配色只有墨+淡沙两层(用户定案)。 */
      .qa-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; animation: qaBootIn 0.4s ease 0.35s forwards;
      }
      .qa-boot svg { width: 148px; height: auto; }
      .qa-boot .qa-sheet { fill: #faf6ec; stroke: rgba(120, 90, 50, 0.28); stroke-width: 1; }
      .qa-boot .qa-bars rect { fill: #e8dcb4; }
      .qa-boot .qa-qing { clip-path: inset(0 0 100% 0); animation: qaQingWipe 3.6s linear infinite; }
      .qa-boot .qa-qing rect { fill: #16212c; opacity: 0.92; }
      @keyframes qaBootIn { to { opacity: 1; } }
      @keyframes qaQingWipe {
        0% { clip-path: inset(0 0 100% 0); opacity: 1; }
        48% { clip-path: inset(0 0 0% 0); opacity: 1; }
        82% { clip-path: inset(0 0 0% 0); opacity: 1; }
        92%, 100% { clip-path: inset(0 0 0% 0); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .qa-boot .qa-qing { animation: none; clip-path: none; }
        .qa-boot .qa-qing rect { opacity: 0.4; }
      }
    </style>
    <script>
      (function () {
        try {
          // 首页固定浅色,落地/懒加载兜底统一铺首页暖纸底(= body 稳态色 --bg-window #ece4d3;
          // 主题暖化后旧冷灰 #e9eae6 与两侧暖底不匹配,首帧会闪"暖两侧+冷中心",故同步为暖值)。
          var bg = "#ece4d3";
          document.documentElement.style.setProperty("--app-boot-bg", bg);
          document.documentElement.style.background = bg;
        } catch (e) {
          /* 异常时走 CSS 兜底 #ece4d3 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 启动骨架(见 head 内 .qa-boot 注释):上三组断杠+下三条通杠 = 地天泰,亦是「青」的骨架 -->
      <div class="qa-boot" aria-hidden="true">
        <svg viewBox="76 99 247 292">
          <rect class="qa-sheet" x="88" y="111" width="223" height="268" />
          <g class="qa-bars">
            <rect x="120" y="143" width="71" height="13" />
            <rect x="209" y="143" width="71" height="13" />
            <rect x="120" y="174" width="71" height="13" />
            <rect x="209" y="174" width="71" height="13" />
            <rect x="120" y="205" width="71" height="13" />
            <rect x="209" y="205" width="71" height="13" />
            <rect x="120" y="270" width="160" height="13" />
            <rect x="120" y="301" width="160" height="13" />
            <rect x="120" y="332" width="160" height="13" />
          </g>
          <!-- 「青」剪影:龶三横等长捅出+中竖出头;月=顶横+左右细竖+内二横,开口朝下 -->
          <g class="qa-qing">
            <rect x="104" y="156" width="192" height="18" />
            <rect x="104" y="187" width="192" height="18" />
            <rect x="191" y="143" width="18" height="75" />
            <rect x="104" y="218" width="192" height="18" />
            <rect x="102" y="252" width="18" height="105" />
            <rect x="102" y="252" width="196" height="18" />
            <rect x="280" y="252" width="18" height="105" />
            <rect x="120" y="283" width="160" height="18" />
            <rect x="120" y="314" width="160" height="18" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
